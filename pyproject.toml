[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risex-funding-farmer"
version = "0.0.0"
description = "Paper-only delta-neutral funding strategy research"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]

[project.scripts]
risex-farmer = "risex_farmer.cli:main"
risex-telegram-provision = "risex_farmer.telegram_config:main"
nado-mainnet-unsigned-read = "risex_farmer.nado_mainnet_unsigned_read:main"
nado-mainnet-archive-read = "risex_farmer.nado_mainnet_archive_read:main"
lighter-testnet-readiness = "risex_farmer.lighter_testnet_readiness:main"
lighter-testnet-level-c = "risex_farmer.lighter_testnet_lifecycle:main"
risex-spread-shadow = "risex_spread_shadow.cli:main"
risex-spread-shadow-fee-read = "risex_spread_shadow.risex_fee_read:main"

[project.optional-dependencies]
risex-fee-read = ["eth-account>=0.13,<0.14"]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "eth-account>=0.13,<0.14",
    "brotli>=1.1,<2",
]
testnet-risex = ["eth-account>=0.13,<0.14"]
testnet-nado = ["eth-account>=0.13,<0.14", "brotli>=1.1,<2"]
mainnet-nado = ["eth-account>=0.13,<0.14"]
testnet-extended = ["x10-python-trading-starknet==2.5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
