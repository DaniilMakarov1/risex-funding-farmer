[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "risex-funding-farmer"
version = "0.0.0"
description = "Paper-only delta-neutral funding strategy research"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4"]

[project.scripts]
risex-farmer = "risex_farmer.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "eth-account>=0.13,<0.14",
]
testnet-risex = ["eth-account>=0.13,<0.14"]
testnet-nado = ["eth-account>=0.13,<0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
